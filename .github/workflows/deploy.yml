# Quality gate only. Deployment is done by Cloudflare Pages' Git integration
# (project "sanctuaryreader"), which builds every push to main.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    name: Type check, lint & test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Lint
        run: bun run --cwd apps/web lint

      - name: Unit & integration tests
        run: bun run --cwd apps/web test

      - name: Backend type check & tests
        run: bunx tsc -p functions/tsconfig.json --noEmit && bun test functions
